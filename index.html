<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <!-- Primary Meta Tags -->
  <title>Todo App - Simple Task Manager</title>
  <meta name="title" content="Todo App - Simple Task Manager" />
  <meta name="description" content="A clean and simple todo list application to manage your daily tasks efficiently. Add, edit, complete, and filter your todos with ease." />
  <meta name="keywords" content="todo, task manager, productivity, checklist, todo list, task list" />
  <meta name="author" content="Todo App" />
  
  <!-- Theme and Mobile -->
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Todo App" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Todo App - Simple Task Manager" />
  <meta property="og:description" content="A clean and simple todo list application to manage your daily tasks efficiently." />
  <meta property="og:site_name" content="Todo App" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Todo App - Simple Task Manager" />
  <meta name="twitter:description" content="A clean and simple todo list application to manage your daily tasks efficiently." />
  
  <!-- Security -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  
  <!-- Preload Critical Resources -->
  <link rel="preload" href="styles.css" as="style" />
  <link rel="preload" href="app.js" as="script" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a href="#app-title" class="skip-to-content">Skip to main content</a>
  <main class="app" aria-labelledby="app-title">
    <h1 id="app-title">Todo</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input id="todo-input" name="todo" type="text" placeholder="What needs to be done?" aria-label="New todo" />
      <button type="submit" aria-label="Add todo">Add</button>
    </form>

    <section class="todo-panel" aria-live="polite">
      <ul id="todo-list" class="todo-list"></ul>

      <div class="todo-footer">
        <span id="todo-count" class="todo-count">0 items left</span>

        <div class="filters" role="tablist" aria-label="Filter todos">
          <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>

        <button id="clear-completed" class="clear-btn">Clear completed</button>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
