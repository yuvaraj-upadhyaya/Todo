<!-- Todo App - A simple, accessible task management application -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main application container -->
    <main class="app" aria-labelledby="app-title">
      <h1 id="app-title">Todo</h1>

      <!-- Form to add new todos -->
      <form id="todo-form" class="todo-form" autocomplete="off">
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="What needs to be done?"
          aria-label="New todo"
        />
        <button type="submit" aria-label="Add todo">Add</button>
      </form>
      <!-- Panel containing the todo list and controls -->
      <section class="todo-panel" aria-live="polite">
        <!-- Dynamic list of todos will be rendered here -->
        <ul id="todo-list" class="todo-list"></ul>

        <!-- Footer with todo count, filters, and clear completed button -->
        <div class="todo-footer">
          <!-- Displays the count of active items -->
          <span id="todo-count" class="todo-count">0 items left</span>

          <!-- Filter buttons for viewing all, active, or completed todos -->
          <div class="filters" role="tablist" aria-label="Filter todos">
            <button
              class="filter-btn active"
              data-filter="all"
              role="tab"
              aria-selected="true"
            >
              All
            </button>
            <button
              class="filter-btn"
              data-filter="active"
              role="tab"
              aria-selected="false"
            >
              Active
            </button>
            <button
              class="filter-btn"
              data-filter="completed"
              role="tab"
              aria-selected="false"
            >
              Completed
            </button>
          </div>

          <!-- Button to remove all completed todos -->
          <button id="clear-completed" class="clear-btn">
            Clear completed
          </button>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
